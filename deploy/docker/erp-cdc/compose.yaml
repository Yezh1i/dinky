name: ${COMPOSE_PROJECT_NAME:-erp-cdc}

services:
  dinky:
    image: ${DINKY_IMAGE}
    hostname: dinky
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      JVM_OPTS: ${DINKY_JVM_OPTS}
      DB_ACTIVE: mysql
      MYSQL_ADDR: ${DINKY_DB_HOST}:${DINKY_DB_PORT}
      MYSQL_DATABASE: ${DINKY_DB_NAME}
      MYSQL_USERNAME: ${DINKY_DB_USER}
      MYSQL_PASSWORD: ${DINKY_DB_PASSWORD}
    ports:
      - ${BIND_IP}:8888:8888
      - ${BIND_IP}:8081:8081
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${DINKY_DATA_ROOT}/customJar:/opt/dinky/customJar
      - ${DINKY_DATA_ROOT}/logs:/opt/dinky/logs
      - ${DINKY_DATA_ROOT}/tmp:/opt/dinky/tmp
      - ./flink-config.yaml:/opt/flink/conf/config.yaml:ro
