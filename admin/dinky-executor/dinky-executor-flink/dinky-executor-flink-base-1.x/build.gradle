plugins {
    id 'java'
    id 'java-library'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

dependencies {
    api(project(":dinky-executor:dinky-executor-base"))

    compileOnly 'org.apache.flink:flink-table-api-java-bridge:1.18.1'
}
