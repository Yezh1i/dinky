[versions]
springboot="3.5.5"
lombok = "1.18.38"
google-auto-service = "1.1.1"
slf4j = "2.0.7"
logback = "1.3.15"
hutool="5.8.39"
fastjson="2.0.58"
druid="1.2.27"
junit="5.10.0"
mybatis-plus="3.5.12"

mysql="9.2.0"
postgresql="42.7.7"

[libraries]

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
google-auto-service = { module = "com.google.auto.service:auto-service", version.ref = "google-auto-service" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
hutool-db = { module = "cn.hutool:hutool-db", version.ref = "hutool" }
hutool-cache = { module = "cn.hutool:hutool-cache", version.ref = "hutool" }
hutool-system = { module = "cn.hutool:hutool-system", version.ref = "hutool" }
hutool-crypto = { module = "cn.hutool:hutool-crypto", version.ref = "hutool" }
hutool-all = { module = "cn.hutool:hutool-all", version.ref = "hutool" }
fastjson = { module = "com.alibaba:fastjson", version.ref = "fastjson" }
fastjson2-extension-spring6 = { module = "com.alibaba.fastjson2:fastjson2-extension-spring6", version.ref = "fastjson" }
druid = { module = "com.alibaba:druid", version.ref = "druid" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springboot" }
mybatis-plus = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "mybatis-plus" }
mybatis-plus-bom = { module = "com.baomidou:mybatis-plus-bom", version.ref = "mybatis-plus" }
