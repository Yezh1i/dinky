name: Build Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: dinky-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and push Flink 1.18 image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      FLINK_VERSION: "1.18"
      MAVEN_OPTS: -Xms1g -Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-setuptools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.5"
          run_install: false

      - name: Build frontend
        working-directory: dinky-web
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
          test -s dist/index.html

      - name: Prepare frontend for Docker
        run: |
          mkdir -p build/dist
          cp -R dinky-web/dist/. build/dist/

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build Dinky release package
        run: |
          ./mvnw -B clean package \
            -Dmaven.test.skip=true \
            -Dspotless.check.skip=true \
            -Denforcer.skip=true \
            -Dmaven.javadoc.skip=true \
            -Pprod,flink-single-version,flink-1.18,maven-central,fast \
            --no-snapshot-updates
          test -n "$(find build -name 'dinky-release-*.tar.gz' -print -quit)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yezh1i/dinky-standalone-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FLINK_VERSION=${{ env.FLINK_VERSION }}
            DINKY_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dinky-flink118
          cache-to: type=gha,mode=max,scope=dinky-flink118
